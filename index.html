/* ------------------------------------------------------------------ audio */
var actx = null, unlocked = false;
function ac() {
  if (!unlocked) { return null; }
  if (!actx) {
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) { return null; }
    try { actx = new A(); } catch (e) { return null; }
  }
  if (actx.state === 'suspended' && actx.resume) { actx.resume(); }
  return actx;
}
function tone(f, dur, type, vol, delay, f2) {
  var c = ac(); if (!c) { return; }
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t0);
  if (f2) { o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t0 + dur); }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol === undefined ? 0.12 : vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noiseBurst(dur, vol, delay, freq) {
  var c = ac(); if (!c) { return; }
  var t0 = c.currentTime + (delay || 0);
  var len = Math.max(1, Math.floor(c.sampleRate * dur));
  var buf = c.createBuffer(1, len, c.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * (1 - i / len); }
  var src = c.createBufferSource(); src.buffer = buf;
  var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq || 900; bp.Q.value = 0.9;
  var g = c.createGain(); g.gain.value = vol === undefined ? 0.1 : vol;
  src.connect(bp); bp.connect(g); g.connect(c.destination);
  src.start(t0);
}
function sfx(kind) {

function addPart(o) {

function updateParticles(dt) {
  var out = [];
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'shard' || p.kind === 'conf') { p.vy += 700 * dt; p.rot += p.vr * dt; }
    else if (p.kind === 'dust') { p.vy += 120 * dt; p.vx *= 0.96; }
    else if (p.kind === 'swirl') { p.vx *= 0.94; p.vy *= 0.94; }
    else if (p.kind === 'star') { p.vy += 180 * dt; }
    out.push(p);

}

  toast('🌀 회오리 점프로 뚫어요!', 1500);
  dust(P.x + PW / 2, P.y + PH * 0.6, 5, '#dcd0ff');

function breakWall(s) {

  shakeIt(0.22);
  shards(s.x, s.y + 60, s.w, GY - s.y - 60);
  sparkle(s.x + s.w / 2, P.y + PH / 2, 20, '#cfeaff');
  toast('🌀 회오리로 뚫었다!', 1100);

function tick(dt) {
  round.effT += dt;
  updateParticles(dt);
  if (shake > 0) { shake = Math.max(0, shake - dt); }
  if (flash > 0) { flash = Math.max(0, flash - dt * 2.2); }
  if (round.state !== 'play') { return; }
  if (round.freeze > 0) {
    round.freeze -= dt;
    if (round.freeze <= 0) { doRespawn(); }
    return;
  }
  round.time += dt;
  round.t += dt;

  var i, m;
  for (i = 0; i < L.movers.length; i++) {
    m = L.movers[i];
    var ph = 2 * Math.PI * (round.t / m.period) + m.phase;
    var nx = m.bx + (m.axis === 'x' ? m.amp * Math.sin(ph) : 0);
    var ny = m.by + (m.axis === 'y' ? m.amp * Math.sin(ph) : 0);
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
  if (P.support && P.support.kind === 'mover' && P.onGround) {
    P.x += P.support.dx; P.y += P.support.dy;
  }

  /* a quick tap still gives a short nudge, so a child never taps and sees
     nothing happen */
  var dir = ((input.right || input.tapR > 0) ? 1 : 0) - ((input.left || input.tapL > 0) ? 1 : 0);
  if (input.tapR > 0) { input.tapR -= dt; }
  if (input.tapL > 0) { input.tapL -= dt; }
  if (P.knock > 0) { P.knock -= dt; dir = P.knockDir; }
  var spd = SPD * (P.spin > 0 ? WSPD : 1);
  P.vx = dir * spd;
  if (dir) { P.face = dir; }

  if (P.coyote > 0) { P.coyote -= dt; }
  if (P.invuln > 0) { P.invuln -= dt; }
  if (P.zapT > 0) { P.zapT -= dt; }
  if (P.spin > 0) { P.spin -= dt; P.spinA += dt * 16; }
  if (P.buffer > 0) { P.buffer -= dt; }

  if (!P.onGround) { P.airT += dt; } else { P.airT = 0; }
  if (P.buffer > 0 && round.state === 'play') {
    if (P.onGround || P.coyote > 0) { jump(false); }
    else if (P.jumps < 2 && P.airT > 0.09) { jump(true); }
  }

  P.vy = Math.min(VY_MAX, P.vy + G * dt);

  var prevBottom = P.y + PH;
  P.x += P.vx * dt;
  collideX();
  P.y += P.vy * dt;
  collideY(prevBottom);

  if (P.onGround) {
    P.anim += dt * (Math.abs(P.vx) > 20 ? 1 : 0.4);
    var sp0 = springAt();
    if (sp0) {
      P.vy = -SPRING_V; P.onGround = false; P.support = null; P.jumps = 0;
      sfx('spring'); sparkle(sp0.x + sp0.w / 2, sp0.y, 10, '#8ef0d3');
      toast('통통!', 700);
    }
  }

  if (P.x < 6) { P.x = 6; }
  if (P.x + PW > L.width - 4) { P.x = L.width - 4 - PW; }

  /* hazards */
  for (i = 0; i < L.lasers.length; i++) {
    var lzr = L.lasers[i];
    if (!laserOn(lzr)) { continue; }
    if (overlap(P, lzr)) { zap(); return; }
  }
  if (P.y > GY + 220) { zap(); return; }

  /* coins */
  for (i = 0; i < L.coins.length; i++) {
    var c = L.coins[i];
    if (c.got) { continue; }
    var dxc = (P.x + PW / 2) - c.x, dyc = (P.y + PH / 2) - c.y;
    if (dxc * dxc + dyc * dyc < 20 * 20) {
      c.got = true; round.coins++; sfx('coin');
      sparkle(c.x, c.y, 7, '#ffd45e');
    }
  }

  /* checkpoints */
  for (i = 0; i < L.cps.length; i++) {
    var cpt = L.cps[i];
    if (cpt.on) { cpt.wave += dt; continue; }
    if (P.x + PW / 2 > cpt.x) {
      cpt.on = true; cpt.wave = 0;
      round.spawn = { x: cpt.x, y: cpt.y };
      sfx('cp'); sparkle(cpt.x, cpt.y - 30, 14, '#9b8cff');
      toast('🚩 체크포인트!', 1100);
    }
  }

  /* goal */
  if (P.x + PW > L.goal.x - 8 && P.y + PH > L.goal.y - 90) { finish(); return; }

  updateCamera(dt);
}

function collideX() {
  var list = L.solids, i, s, d;
  for (i = 0; i < list.length; i++) {
    s = list[i];
    if (s.broken) { continue; }
    if (!overlap(P, s)) { continue; }
    d = P.vx > 0 ? 1 : (P.vx < 0 ? -1 : P.face);
    if (s.kind === 'wall') {
      if (P.spin > 0) { breakWall(s); continue; }
      if (d > 0) { P.x = s.x - PW; } else { P.x = s.x + s.w; }
      P.vx = 0; P.knock = 0.18; P.knockDir = -d;
      wallBump(s);
      continue;
    }
    if (d > 0) { P.x = s.x - PW; } else { P.x = s.x + s.w; }
    P.vx = 0;
  }
}

function collideY(prevBottom) {
  var list = L.solids, i, s, landed = false;
  P.onGround = false; P.support = null;
  for (i = 0; i < list.length; i++) {
    s = list[i];
    if (s.broken) { continue; }
    if (!overlap(P, s)) { continue; }
    if (P.vy >= 0 && prevBottom <= s.y + 7) {
      P.y = s.y - PH; P.vy = 0;
      if (!P.onGround) { landed = true; }
      P.onGround = true; P.support = s; P.jumps = 0; P.coyote = COY;
    } else if (P.vy < 0) {
      P.y = s.y + s.h; P.vy = 0;
    }
  }
  if (landed) {
    P.spin = 0;
    if (P.zapT <= 0) { sfx('land'); }
    dust(P.x + PW / 2, P.y + PH, 5);
  }
}

function springAt() {
  for (var i = 0; i < L.springs.length; i++) {
    var s = L.springs[i];
    if (overlap(P, s) && P.y + PH <= s.y + 12) { return s; }
  }
  return null;
}

function laserOn(l) {
  if (!l.blink) { return true; }
  var ph = (round.t + l.phase) % l.period;
  return ph < l.period * l.duty;
}

function zap() {
  if (P.invuln > 0 || round.state !== 'play') { return; }
  round.mistakes++;
  sfx('zap'); shakeIt(0.34); flash = 1;
  P.zapT = 0.5; P.spin = 0; P.vx = 0; P.vy = 0;
  sparkle(P.x + PW / 2, P.y + PH / 2, 14, '#ffd0e0');
  round.freeze = 0.42;
}

function doRespawn() {
  P.x = round.spawn.x; P.y = round.spawn.y - PH;
  P.vx = 0; P.vy = 0; P.spin = 0; P.jumps = 0; P.knock = 0;
  P.invuln = 1.1; P.zapT = 0; P.onGround = false; P.support = null;
  for (var i = 0; i < L.walls.length; i++) { L.walls[i].broken = false; L.walls[i].hit = 0; }
  updateCamera(0, true);
  dust(P.x + PW / 2, P.y + PH, 8);
}

function starsFor() {
  if (round.mistakes === 0) { return 3; }
  if (round.mistakes <= 2) { return 2; }
  if (round.mistakes <= 5) { return 1; }
  return 0;
}

function finish() {
  if (round.state !== 'play') { return; }
  round.state = 'clear';
  P.spin = 0;
  var stars = starsFor();
  round.cleared = true;
  sfx('win'); confetti();
  save.best = save.best || {};
  var b = save.best[String(round.lv)] || { time: 0, mistakes: 0, coins: 0, stars: 0 };
  var newRec = !b.time || b.time > round.time;
  if (newRec || !b.time) { b.time = round.time; b.mistakes = round.mistakes; b.coins = round.coins; }
  if (stars > (b.stars || 0)) { b.stars = stars; }
  b.cleared = true;
  save.best[String(round.lv)] = b;
  save.lastLevel = round.lv;
  writeStore();
  showClear(stars, newRec);
  updateTabs();
}

function shakeIt(v) { shake = Math.max(shake, v); }

/* --------------------------------------------------------------- camera */
function updateCamera(dt, snap) {
  var viewW = cssW / scale, viewH = cssH / scale;
  var targetX = clamp(P.x + PW / 2 - viewW * 0.42, 0, Math.max(0, L.width - viewW));
  var baseY = GY + 46 - viewH;
  var targetY = baseY;
  if (P.y - 26 < targetY) { targetY = P.y - 26; }
  targetY = Math.min(targetY, GY + 64 - viewH);
  if (snap) { camX = targetX; camY = targetY; return; }
  var k = clamp((dt || 0) * 9, 0, 1);
  camX = lerp(camX, targetX, k);
  camY = lerp(camY, targetY, k);
}

/* ------------------------------------------------------------- autopilot
   Runs the real tick() with a simple route follower. Used by the tests to
   prove that every stage can be finished with the jump button alone. */
function reachFor(rise) {
  if (rise <= 0) { return 118; }
  if (rise <= 50) { return 96; }
  if (rise <= 80) { return 70; }
  if (rise <= 110) { return 48; }
  return 30;
}
function routeTarget() {
  var r = L.route, i, k = -1;
  if (P.onGround && P.support) { k = r.indexOf(P.support); }
  if (k >= 0) { return { i: k + 1, p: (k + 1 < r.length) ? r[k + 1] : null }; }
  for (i = 0; i < r.length; i++) {
    if (r[i].x + r[i].w > P.x + PW * 0.5) { return { i: i, p: r[i] }; }
  }
  return { i: r.length, p: null };
}
function wallAhead(dir) {
  var best = null, bd = 1e9;
  for (var i = 0; i < L.walls.length; i++) {
    var w = L.walls[i];
    if (w.broken) { continue; }
    var d = (w.x - (P.x + PW)) * dir;
    if (d > -30 && d < bd) { bd = d; best = w; }
  }
  return best;
}
function laserAhead(dir) {
  var best = null, bd = 1e9;
  for (var i = 0; i < L.lasers.length; i++) {
    var l = L.lasers[i];
    if (Math.abs((l.y + l.h) - (P.y + PH)) > 40) { continue; }
    var d = (l.x - (P.x + PW)) * dir;
    if (d > -20 && d < bd) { bd = d; best = l; }
  }
  return best;
}
function autoControl() {
  var dir = 1;
  input.left = false; input.right = false;
  if (round.state !== 'play' || round.freeze > 0) { return; }
  var t = routeTarget();
  var tx, ty, tw;
  if (t.p) { tx = t.p.x; ty = t.p.y; tw = t.p.w; }
  else { tx = L.goal.x; ty = L.goal.y; tw = 24; }
  var px = P.x + PW / 2;
  var tcx = tx + tw / 2;
  dir = (tx + tw < px - 2) ? -1 : 1;
  var feet = P.y + PH;
  var sup = P.support;

  /* whirl wall: jump first, then air-jump (=whirl) into it */
  var wall = wallAhead(dir);
  if (wall) {
    var wd = (wall.x - (P.x + PW)) * dir;
    if (P.onGround && P.jumps === 0 && wd < 96) { dir = 1; pressJump(); }
    else if (!P.onGround && P.jumps === 1 && wd < 84 && P.buffer <= 0) { pressJump(); }
  }

  /* lasers */
  var l = laserAhead(dir);
  if (l && !(wall && (wall.x - (P.x + PW)) * dir < 120)) {
    var ld = (l.x - (P.x + PW)) * dir;
    if (l.blink) {
      if (laserOn(l)) { if (ld < 54) { dir = 0; } }
      else if (ld < 42 && P.onGround && P.jumps === 0) { pressJump(); }
    } else if (ld < 38 && P.onGround && P.jumps === 0 && P.buffer <= 0) { pressJump(); }
  }

  /* gap / step onto the next platform: jump at the point that lands on it */
  if (P.onGround && sup && sup !== t.p) {
    var lead = dir > 0 ? P.x + PW : P.x;
    var edge = dir > 0 ? sup.x + sup.w : sup.x;
    var toEdge = (edge - lead) * dir;
    var nearEdge = dir > 0 ? tx : tx + tw;
    var gap = (nearEdge - lead) * dir;
    var rise = feet - ty;
    var span = 132 - (rise > 0 ? rise * 0.6 : 0);
    var ideal = nearEdge + 16 - span;
    var latest = dir > 0 ? edge - PW + 2 : edge - 2;
    var go = Math.min(ideal, latest);
    if ((P.x - go) * dir >= -2) {
      if (gap <= reachFor(rise)) { pressJump(); }
      else { dir = 0; }
    }
  }

  /* in the air: land the second (whirl) jump only when it is really needed */
  if (!P.onGround && P.jumps === 1 && P.vy > 70 && P.buffer <= 0) {
    var lead2 = dir > 0 ? P.x + PW : P.x;
    var near2 = dir > 0 ? tx : tx + tw;
    var gap2 = (near2 - lead2) * dir;
    if (P.y + PH > ty + 26 && gap2 > 8 && gap2 < 210) { pressJump(); }
  }

  input.right = dir > 0;
}
function autoSolve(levelNo, maxSec) {
  startLevel(levelNo);
  var frames = 0, limit = Math.round((maxSec || 90) / DT);
  var lastX = P.x, stuck = 0, maxX = P.x;
  while (frames < limit) {
    if (round.state === 'clear') {
      return { ok: true, frames: frames, time: round.time, mistakes: round.mistakes, coins: round.coins, maxX: maxX };
    }
    if (round.state !== 'play') { break; }
    autoControl();
    tick(DT);
    frames++;
    if (P.x > maxX) { maxX = P.x; }
    if (frames % 45 === 0) {
      if (Math.abs(P.x - lastX) < 3) { stuck++; } else { stuck = 0; }
      lastX = P.x;
      if (stuck > 26) { return { ok: false, reason: 'stuck', x: P.x, frames: frames, maxX: maxX, mistakes: round.mistakes }; }
    }
  }
  return { ok: false, reason: 'timeout', x: P.x, frames: frames, maxX: maxX, mistakes: round.mistakes };
}

var cv = null, ctx = null;
var paused = false;

function drawCloud(x, y, sc) {

  ctx.beginPath();
  ctx.ellipse(x, y, 26 * sc, 13 * sc, 0, 0, 6.283);

}

function drawPerson() {

function draw() {
  if (!ctx) { return; }
  var W = cv.width, H = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.sky[0]);
  g.addColorStop(0.62, L.sky[1]);
  g.addColorStop(1, L.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* soft sun in screen space, so the sky never looks empty on a tall phone */
  var sux = W * 0.78, suy = H * 0.16, sur = Math.min(W, H) * 0.19;
  var sg = ctx.createRadialGradient(sux, suy, 0, sux, suy, sur);
  sg.addColorStop(0, 'rgba(255,242,190,.95)');
  sg.addColorStop(0.45, 'rgba(255,236,170,.42)');
  sg.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sux - sur, suy - sur, sur * 2, sur * 2);
  ctx.beginPath();
  ctx.arc(sux, suy, Math.min(W, H) * 0.072, 0, 6.283);
  ctx.fillStyle = 'rgba(255,248,214,.92)';
  ctx.fill();

  if (shake > 0) {
    sx = (Math.random() * 2 - 1) * shake * 16;
    sy = (Math.random() * 2 - 1) * shake * 16;
  }
  var s = dpr * scale;
  ctx.setTransform(s, 0, 0, s, -camX * s + sx * dpr, -camY * s + sy * dpr);
  drawClouds();
  drawHills();
  var i;
  for (i = 0; i < L.floors.length; i++) { drawFloor(L.floors[i]); }
  for (i = 0; i < L.movers.length; i++) { drawMover(L.movers[i]); }
  for (i = 0; i < L.springs.length; i++) { drawSpring(L.springs[i]); }
  for (i = 0; i < L.walls.length; i++) { drawWall(L.walls[i]); }
  for (i = 0; i < L.lasers.length; i++) { drawLaser(L.lasers[i]); }
  for (i = 0; i < L.cps.length; i++) { drawCp(L.cps[i]); }
  drawGoal(L.goal);
  for (i = 0; i < L.coins.length; i++) { drawCoin(L.coins[i]); }
  drawParticles();
  drawPerson();
  if (flash > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(255,215,232,' + (flash * 0.45) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function copyLink(url) {
  function done(ok) {
    toast(ok ? '링크를 복사했어요! 친구에게 붙여넣기 해 주세요.' : '주소창의 주소를 복사해 주세요: ' + url, 2600);
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    if (ta.select) { ta.select(); }
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    done(ok);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { done(true); }, fallback);
      return;
    }
  } catch (e) {}
  fallback();
}

function startLevel(n) {
  n = clamp(n, 1, META.length);
  L = buildLevel(n - 1);
  round.lv = n;
  round.t = 0; round.time = 0; round.mistakes = 0; round.coins = 0;
  round.state = 'play'; round.freeze = 0; round.cleared = false;
  round.spawn = { x: L.spawn.x, y: L.spawn.y };
  P = newPlayer(L.spawn.x, L.spawn.y - PH);
  for (var fi = 0; fi < L.floors.length; fi++) {
    var ff = L.floors[fi];
    if (P.x + PW > ff.x && P.x < ff.x + ff.w && Math.abs(L.spawn.y - ff.y) < 2) {
      P.onGround = true; P.support = ff;
    }
  }
  particles = [];
  input.left = false; input.right = false;
  paused = false;
  flash = 0; shake = 0;
  if (cv) { updateCamera(0, true); }
  $('clearMask').hidden = true;
  $('pauseMask').hidden = true;
  updateTabs();
  updateHud();
  toast(L.hint, 2400);
  save.lastLevel = n;
  writeStore();
}

/* ------------------------------------------------------------------- loop */
var lastTs = 0, acc = 0;
function loop(ts) {
  if (!lastTs) { lastTs = ts; }
  var dt = Math.min(0.06, (ts - lastTs) / 1000);
  lastTs = ts;
  if (dt < 0) { dt = 0; }
  if (round.state === 'play' && !paused) {
    acc += dt;
    var guard = 0;
    while (acc >= DT && guard < 5) { tick(DT); acc -= DT; guard++; }
  } else {
    updateParticles(dt);
  }
  draw();
  updateHud();
  if (requestAnimationFrame) { requestAnimationFrame(loop); }
}

function resize() {
  if (!cv) { return; }
  var r = $('stage').getBoundingClientRect();
  cssW = Math.max(180, r.width || 360);
  cssH = Math.max(140, r.height || 380);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  /* keep the play field from turning into empty sky on tall phones: widen the
     zoom with the stage height, but never show less than 250 world units
     across, so the next platform is always in view. */
  scale = Math.max(cssW / VW, Math.min(cssH / 400, cssW / 250));
  if (L) { updateCamera(0, true); draw(); }
}

function bindUI() {
  bindHold($('btnLeft'), function () { input.left = true; input.tapL = 0.11; }, function () { input.left = false; });
  bindHold($('btnRight'), function () { input.right = true; input.tapR = 0.11; }, function () { input.right = false; });
  var jb = $('btnJump');
  bindHold(jb, function () {
    pressJump();
    jb.classList.remove('flash');
    void jb.offsetWidth;
    jb.classList.add('flash');
  }, function () {});

  $('sndBtn').addEventListener('click', function () {
    unlocked = true;
    save.muted = !save.muted;
    writeStore();
    applyMute();
    toast(save.muted ? '효과음을 껐어요' : '효과음을 켰어요', 1200);
    if (!save.muted) { sfx('tap'); }
  });
  $('retryBtn').addEventListener('click', function () { sfx('tap'); startLevel(round.lv); });
  $('pauseBtn').addEventListener('click', function () { setPaused(true); });
  $('resumeBtn').addEventListener('click', function () { setPaused(false); });
  $('againBtn').addEventListener('click', function () { sfx('tap'); startLevel(round.lv); });
  $('nextBtn').addEventListener('click', function () {
    sfx('tap');
    startLevel(Math.min(META.length, round.lv + 1));
  });
  $('shareBtn').addEventListener('click', shareGame);

  document.addEventListener('keydown', function (e) {
    if (!e || !e.key) { return; }
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = true; input.tapL = 0.11; }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = true; input.tapR = 0.11; }
    else if (k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W') {
      if (e.preventDefault) { e.preventDefault(); }
      pressJump();
    } else if (k >= '1' && k <= '6') { startLevel(parseInt(k, 10)); }
    else if (k === 'Escape') { setPaused(!paused); }
  });
  document.addEventListener('keyup', function (e) {
    if (!e || !e.key) { return; }
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { input.left = false; }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { input.right = false; }
  });
  document.addEventListener('pointerdown', function () { unlocked = true; }, { once: true });
  if (window.addEventListener) {
    window.addEventListener('resize', function () { resize(); });
    window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });
  }
}

function init() {
  cv = $('cv');
  ctx = cv.getContext('2d');
  hudCoins = $('hudCoins'); hudMiss = $('hudMiss'); hudTime = $('hudTime'); toastEl = $('toast');
  var stored = readStore();
  save.muted = !!stored.muted;
  save.best = stored.best || {};
  save.lastLevel = stored.lastLevel || 1;
  applyMute();
  buildTabs();
  bindUI();
  setupManifest();
  resize();
  startLevel(clamp(save.lastLevel, 1, META.length));
  if (typeof requestAnimationFrame === 'function' && !window.__noRAF) { requestAnimationFrame(loop); }
}

/* -------------------------------------------------------------- test hook */
window.__jump = {
  VW: VW, GY: GY, G: G, SPD: SPD, JV: JV, WV: WV, WSPD: WSPD, SPIN_T: SPIN_T,
  DT: DT, PW: PW, PH: PH, META: META, BUILD: BUILD,
  buildLevel: buildLevel, startLevel: startLevel, tick: tick, draw: draw,
  autoSolve: autoSolve, autoControl: autoControl, pressJump: pressJump,
  jump: jump, zap: zap, finish: finish, starsFor: starsFor, laserOn: laserOn,
  springAt: springAt, overlap: overlap, updateCamera: updateCamera,
  state: function () { return round; },
  player: function () { return P; },
  level: function () { return L; },
  input: input,
  parts: function () { return particles; },
  save: save,
  toast: toast,
  resize: resize,
  setPaused: setPaused,
  isPaused: function () { return paused; }
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>
